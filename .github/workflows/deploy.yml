name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 20 * * *" # daily at 22:00 South Africa time: refreshes the calendar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate GitHub contributions token
        run: |
          if [ -z "$GH_CONTRIBUTIONS_TOKEN" ]; then
            echo "::error::Add the GH_CONTRIBUTIONS_TOKEN repository secret with read:user access for craighlongwani."
            exit 1
          fi
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
      - run: npm run build
        env:
          # A user token with read:user access; never expose it to client code.
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
